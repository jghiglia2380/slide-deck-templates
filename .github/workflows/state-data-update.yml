name: State data update

# Runs state_data_updater.py on the cadence already declared in
# state-data/automation/config.json and opens a PULL REQUEST with whatever
# changed. It never commits to main — the updater was built PR-for-review and
# that gate is preserved here deliberately.
#
# Cadence (config.json -> update_schedules), all declared America/New_York:
#   monthly    day 1, 02:00 ET  — gas prices, loan rates, unemployment
#   quarterly  Jan/Apr/Jul/Oct 1, 03:00 ET — housing, insurance, bank fees
#   annual     Sep 1, 04:00 ET  — taxes, tuition, DMV fees, URLs, agency names
#
# GitHub cron has no timezone support, so the UTC times below are pinned to
# EST (UTC-5). During EDT they fire one hour earlier in local terms. That drift
# is harmless for a monthly/quarterly/annual job; do not "fix" it by guessing a
# second cron, or the job runs twice half the year.

on:
  schedule:
    - cron: "0 7 1 * *"          # 02:00 EST, 1st of every month      -> monthly
    - cron: "0 8 1 1,4,7,10 *"   # 03:00 EST, 1st of Jan/Apr/Jul/Oct  -> quarterly
    - cron: "0 9 1 9 *"          # 04:00 EST, Sep 1                   -> annual
  workflow_dispatch:
    inputs:
      update_type:
        description: "Which update bucket to run"
        required: true
        type: choice
        options: [monthly, quarterly, annual]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: state-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: state-data/automation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve update type
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 1 * *")        TYPE=monthly ;;
            "0 8 1 1,4,7,10 *") TYPE=quarterly ;;
            "0 9 1 9 *")        TYPE=annual ;;
            *)                  TYPE="${{ inputs.update_type }}" ;;
          esac
          if [ -z "$TYPE" ]; then
            echo "::error::Could not resolve an update type."
            exit 1
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Running the $TYPE update."

      - name: Run updater
        working-directory: state-data/automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python state_data_updater.py --run-now "${{ steps.which.outputs.type }}"

      - name: Count fields needing human verification
        id: flags
        run: |
          set -euo pipefail
          FILE=$(ls -t state-data/changelog/*_"${{ steps.which.outputs.type }}".json 2>/dev/null | head -1 || true)
          if [ -z "$FILE" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('needs_verification_count',0))" "$FILE")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          python - "$FILE" > /tmp/flagged.md <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          rows = d.get('needs_verification', [])
          if rows:
              print("| State | Variable | Previous value |")
              print("|---|---|---|")
              for r in rows[:100]:
                  print(f"| {r.get('state','?')} | `{r.get('variable','?')}` | {r.get('old_value','—')} |")
              if len(rows) > 100:
                  print(f"\n_… and {len(rows) - 100} more._")
          PY

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE: ${{ steps.which.outputs.type }}
        run: |
          set -euo pipefail

          # Review-relevant output only. backups/ is a full copy of every state
          # file the updater touched and would bury the actual diff; logs/ is
          # runtime noise. Both stay out of the PR.
          git add -- state-data/states state-data/changelog state-data/notifications 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changed — nothing to open a PR for."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          BRANCH="state-data/${TYPE}-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "State data: ${TYPE} update $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          FLAGS="${{ steps.flags.outputs.count }}"
          {
            if [ "$FLAGS" -gt 0 ]; then
              echo "# ⛔ DO NOT MERGE AS-IS — ${FLAGS} field(s) need a human value"
              echo
              echo "The updater could **not source** these values, so it wrote the literal"
              echo "string \`NEEDS_HUMAN_VERIFICATION\` into each field instead of a number."
              echo "That is deliberate: an unsourced figure that looks real is worse than a"
              echo "visibly missing one. **Replace every one with a verified value before merging.**"
              echo
              cat /tmp/flagged.md 2>/dev/null || true
              echo
              echo "---"
              echo
            fi
            echo "Automated **${TYPE}** run of \`state-data/automation/state_data_updater.py\`."
            echo
            echo "### Changed files"
            echo '```'
            git diff --name-only origin/${{ github.ref_name }}...HEAD
            echo '```'
            echo
            echo "### Review before merging"
            echo "Every value here was produced by the updater, **not** by a human."
            echo "Check each changed number against its authoritative source before approving."
            echo
            echo "> ⚠️ The updater has no web-search tool wired, so it cannot look values up."
            echo "> Rather than emit a model-recalled number with no source, it flags the field."
            echo "> Until a real fetch path is built, expect every field to come back flagged."
          } > /tmp/pr-body.md

          TITLE="State data: ${TYPE} update $(date -u +%Y-%m-%d)"
          if [ "$FLAGS" -gt 0 ]; then
            TITLE="[NEEDS VERIFICATION] ${TITLE} (${FLAGS} unsourced)"
          fi

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md
